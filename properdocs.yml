site_name: ruststream-zeromq
site_description: The ZeroMQ transport for RustStream - PUSH/PULL, PUB/SUB, and DEALER/ROUTER patterns over a documented wire layout.
site_url: https://powersemmi.github.io/ruststream-zeromq/
repo_url: https://github.com/powersemmi/ruststream-zeromq
repo_name: powersemmi/ruststream-zeromq
edit_uri: edit/main/docs/
copyright: Apache-2.0

theme:
  name: material
  custom_dir: overrides
  features:
    - navigation.sections
    - navigation.top
    - navigation.tracking
    - navigation.indexes
    - content.code.copy
    - content.code.annotate
    - content.action.edit
    - search.suggest
    - search.highlight
    - toc.follow
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: deep orange
      accent: deep orange
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: deep orange
      accent: deep orange
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  icon:
    repo: fontawesome/brands/github

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  # Renders :material-xxx: / :fontawesome-xxx: shortcodes (used on the home page grid) as inline
  # SVG icons. Without it those shortcodes show up as literal text.
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - toc:
      permalink: true
      # Keeps non-ASCII headings: the default slugifier gives them empty ids.
      slugify: !!python/object/apply:pymdownx.slugs.slugify
        kwds:
          case: lower
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.superfences
  - pymdownx.details
  - pymdownx.snippets:
      base_path: ["."]
      check_paths: true
      dedent_subsections: true
  - pymdownx.tabbed:
      alternate_style: true

hooks:
  - docs/hooks/snippet_titles.py
  - docs/hooks/i18n_banner.py

plugins:
  - search
  # Versioned docs are published with `mike` (see the Docs workflow and the version switcher).
  # Translations live under `docs/<locale>/`; English stays at the docs root as the default.
  - i18n:
      docs_structure: folder
      fallback_to_default: true
      reconfigure_material: true
      reconfigure_search: true
      languages:
        - locale: en
          name: English
          default: true
          build: true
        - locale: ru
          name: Russian
          build: true
          nav_translations:
            Home: Главная
            Guide: Руководство
            RustStream docs: Документация RustStream
            API reference: Справочник API
        - locale: zh
          name: Chinese
          build: true
          nav_translations:
            Home: 首页
            Guide: 指南
            RustStream docs: RustStream 文档
            API reference: API 参考

extra:
  version:
    provider: mike
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/powersemmi/ruststream-zeromq

nav:
  - Home: index.md
  - Guide:
      - zeromq.md
  - RustStream docs: https://powersemmi.github.io/ruststream/
  - API reference: https://docs.rs/ruststream-zeromq
