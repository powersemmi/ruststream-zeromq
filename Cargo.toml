[workspace]
resolver = "3"
members = ["crates/ruststream-zeromq"]

[workspace.package]
version = "0.7.0"
edition = "2024"
# Follows the core's floor: ruststream 0.7 raised it from 1.85.
rust-version = "1.88"
license = "Apache-2.0"
repository = "https://github.com/powersemmi/ruststream-zeromq"
authors = ["RustStream contributors"]

[workspace.dependencies]
ruststream-zeromq = { path = "crates/ruststream-zeromq" }

ruststream = { version = ">=0.7.0, <0.8.0", default-features = false }

# Floors, not majors: a major-only bound resolves below the APIs used here under minimal-versions.
zeromq = { version = "0.6", default-features = false, features = ["tokio-runtime", "all-transport"] }
bytes = "1.5"
futures = "0.3.30"
thiserror = "2.0.3"
tokio = { version = "1.38", features = ["rt-multi-thread", "macros", "sync", "time"] }
tracing = "0.1.40"

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"
unreachable_pub = "deny"
missing_docs = "deny"
missing_debug_implementations = "warn"
unused_qualifications = "warn"

[workspace.lints.clippy]
correctness = { level = "deny", priority = -1 }
suspicious = { level = "deny", priority = -1 }
perf = { level = "deny", priority = -1 }
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
cargo = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
missing_const_for_fn = "allow"
multiple_crate_versions = "allow"
redundant_pub_crate = "allow"
