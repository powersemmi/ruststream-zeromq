[package]
name = "ruststream-zeromq"
description = "ZeroMQ transport implementation of the RustStream broker contract, for bridging to non-Rust peers."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
readme = "../../README.md"
keywords = ["zeromq", "zmq", "messaging", "broker", "ruststream"]
categories = ["asynchronous", "network-programming"]
# Every file under `tests/` is a module of one test binary: one link instead of one per file.
autotests = false

[lints]
workspace = true

[features]
default = []
# The in-process test broker (TestableBroker + TestApp support). The conformance harness is a
# broker-author tool and stays in this repo's dev-dependencies, not in the user-facing feature.
testing = ["ruststream/testing"]
# The protocol bindings and the server coordinate this crate contributes to the generated
# AsyncAPI document. Forwarded from the core, which gates the hooks on the same name.
asyncapi = ["ruststream/asyncapi"]
# The core's codecs, each with the `Framed` document it writes, and the in-process mode's
# registration of a `Framed` envelope over it.
json = ["ruststream/json", "dep:serde_json", "dep:base64"]
cbor = ["ruststream/cbor"]
msgpack = ["ruststream/msgpack"]

[dependencies]
ruststream = { workspace = true, default-features = false }
zeromq.workspace = true
bytes.workspace = true
futures.workspace = true
aliasable.workspace = true
selfie.workspace = true
serde = { version = "1.0.196", features = ["derive"] }
# `Framed<JsonCodec>` embeds a JSON payload as it is written (`RawValue`) and carries other bytes
# as base64, the way CloudEvents' JSON format does.
serde_json = { version = "1.0.113", features = ["raw_value"], optional = true }
base64 = { version = "0.22.1", optional = true }
thiserror.workspace = true
tokio.workspace = true
tracing.workspace = true

[dev-dependencies]
# The client's socket traits are `#[async_trait]`, so a stand-in socket a test drives is written
# with the same macro.
async-trait = "0.1"
ruststream = { workspace = true, features = [
    "asyncapi",
    "conformance",
    "testing",
    "macros",
    "json",
] }
serde = { version = "1.0.196", features = ["derive"] }
serde_json = "1.0.113"
# Builds the examples' tests into one test binary (`tests/examples.rs`) instead of a test binary
# per example. It lives in the core repository and is not published: a dev-dependency without a
# version is dropped on publish.
ruststream-example-suite = { git = "https://github.com/powersemmi/ruststream", branch = "main" }
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "sync", "time"] }
# The compile-fail snapshots in `tests/ui`: mounts this crate rejects at compile time.
trybuild = "1.0.121"

[package.metadata.docs.rs]
all-features = true

[[test]]
name = "suite"
path = "tests/main.rs"

# The tests of the examples, one module per example, in a binary of their own beside the suite.
[[test]]
name = "examples"
path = "tests/examples.rs"

