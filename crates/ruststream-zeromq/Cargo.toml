[package]
name = "ruststream-zeromq"
description = "ZeroMQ transport implementation of the RustStream broker contract, for bridging to non-Rust peers."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
readme = "../../README.md"
keywords = ["zeromq", "zmq", "messaging", "broker", "ruststream"]
categories = ["asynchronous", "network-programming"]

[lints]
workspace = true

[features]
default = []
# The in-process test broker (TestableBroker + TestApp support). The conformance harness is a
# broker-author tool and stays in this repo's dev-dependencies, not in the user-facing feature.
testing = ["ruststream/testing"]
# The protocol bindings and the server coordinate this crate contributes to the generated
# AsyncAPI document. Forwarded from the core, which gates the hooks on the same name.
asyncapi = ["ruststream/asyncapi", "dep:serde"]

[dependencies]
ruststream = { workspace = true, default-features = false }
zeromq.workspace = true
bytes.workspace = true
futures.workspace = true
serde = { version = "1.0.196", features = ["derive"], optional = true }
thiserror.workspace = true
tokio.workspace = true
tracing.workspace = true

[dev-dependencies]
# The client's socket traits are `#[async_trait]`, so a stand-in socket a test drives is written
# with the same macro.
async-trait = "0.1"
ruststream = { workspace = true, features = [
    "asyncapi",
    "conformance",
    "testing",
    "macros",
    "json",
] }
serde = { version = "1.0.196", features = ["derive"] }
serde_json = "1.0.113"
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "sync", "time"] }
# The compile-fail snapshots in `tests/ui`: mounts this crate rejects at compile time.
trybuild = "1.0.121"

[package.metadata.docs.rs]
all-features = true
