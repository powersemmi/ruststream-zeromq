[package]
name = "ruststream-zeromq-bench"
description = "The benchmarks of ruststream-zeromq: the paired raw-versus-framework comparison and the code cost per message. Never published."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish = false

[lints]
workspace = true

[features]
default = []
# A benchmark measures what ships, and the framework's harness feature swaps this crate's broker
# for an in-process stand-in. Nothing here enables it; the feature exists so that asking for it is
# the compile error in every benchmark here rather than a number nobody can trust.
testing = ["ruststream-zeromq/testing"]

# The benchmark lives in its own package so that the measured binary links this crate the way a
# service does. `ruststream-zeromq`'s own dev-dependencies pull `ruststream/conformance`, which
# enables `ruststream/testing`, and a benchmark inside that package would be built against it.
#
# `macros` and `json` are the service's: the framework loop and every code-cost scenario are the
# service a user writes, so they need `#[subscriber]` and the default codec. The adapter loop uses
# neither.
[dev-dependencies]
ruststream-zeromq.workspace = true
ruststream = { workspace = true, features = ["macros", "json"] }
bytes.workspace = true
futures.workspace = true
# The code-cost benchmarks: callgrind and DHAT through the runner the core pins.
gungraun = "=0.19.4"
serde = { version = "1.0.196", features = ["derive"] }
serde_json = "1.0.113"
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "sync", "time"] }
zeromq.workspace = true

[[bench]]
name = "paired"
harness = false

# The code-cost benchmarks: one scenario per binary, each a service on the production broker, bound
# on the loopback. `just bench-code` runs them under valgrind; `benches/common` is the shared setup.
[[bench]]
name = "consume"
harness = false

[[bench]]
name = "reply"
harness = false

[[bench]]
name = "batch"
harness = false
