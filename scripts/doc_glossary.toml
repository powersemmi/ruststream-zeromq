ru_match = "безопасн\\w* при отмене"
zh = "取消安全"

[[term]]
en = "compile time"
en_match = "compile[- ]time"
ru = "время компиляции"
ru_match = "компиляци"
zh = "编译期"
zh_match = "编译(期|时)"

[[term]]
