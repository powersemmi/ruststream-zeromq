# Locked renderings for the documentation's terms of art.
#
# A machine translation of technical prose does not fail by producing unreadable text; it
# fails by rendering a term of art with a dictionary synonym, so that two pages of the same
# site name the same concept differently and the reader cannot tell whether a distinction is
# meant. Each term below therefore has exactly one rendering per language, and
# `scripts/check_doc_i18n.py` enforces it: where the English page uses a listed term, the
# translated page has to use the locked equivalent.
#
# Two vocabularies meet on this site, and the rule between them is settled here. A concept
# that belongs to ZeroMQ (a socket, a pattern, an endpoint, a frame, a peer) is named with
# ZeroMQ's own term in the target language, the one the ZeroMQ guide and its translations
# write. A concept that belongs to the framework (a batch, a mount site, the harness,
# redelivery) is named with the rendering the RustStream core documentation uses, so a reader
# moving between the two sites meets one word per concept. Where the two collide on one page,
# ZeroMQ keeps its word and the framework's concept is qualified rather than renamed.
#
# Fields:
#   en        the English term, matched case-insensitively on word boundaries
#   en_match  optional regex replacing that default match (for irregular plurals or spellings)
#   ru, zh    the locked rendering, and what a translator must write
#   ru_match  optional regex accepting inflected forms of the Russian rendering
#   zh_match  optional regex, same purpose, rarely needed
#
# A term kept in Latin script in a target language is a deliberate choice, not an oversight:
# `ack`, `trait` and `crate` are what Russian and Chinese Rust texts actually write, and
# replacing them with a translated coinage would make the page harder to read, not easier.
# The pattern names (`PUB`, `SUB`, `PUSH`, `PULL`, `DEALER`, `ROUTER`) are wire vocabulary and
# stay as they are in every language.
#
# Adding a term here is cheap and retroactive: the check reports every existing translated
# page that does not yet honour it, so add terms only once their rendering is settled.

[[term]]
en = "ack"
ru = "ack"
zh = "ack"

[[term]]
en = "nack"
ru = "nack"
zh = "nack"

[[term]]
en = "broker"
en_match = "brokers?"
ru = "брокер"
ru_match = "брокер"
zh = "Broker"
zh_match = "(?i)broker"

[[term]]
en = "subscriber"
en_match = "subscribers?"
ru = "подписчик"
ru_match = "подписчик"
zh = "订阅者"

[[term]]
en = "publisher"
en_match = "publishers?"
ru = "издатель"
ru_match = "издател"
zh = "发布者"

[[term]]
en = "capability"
en_match = "capabilit(y|ies)"
ru = "совместимость"
ru_match = "совместимост"
zh = "能力"

[[term]]
en = "batch"
en_match = "batch(es|ed|ing)?"
ru = "пакет"
ru_match = "пакет"
zh = "批"

[[term]]
en = "subscription"
en_match = "subscriptions?"
ru = "подписка"
ru_match = "подписк"
zh = "订阅"

[[term]]
en = "handler"
en_match = "handlers?"
ru = "обработчик"
ru_match = "обработчик"
zh = "处理器"

[[term]]
en = "message"
en_match = "messages?"
ru = "сообщение"
ru_match = "сообщени"
zh = "消息"

[[term]]
en = "middleware"
ru = "middleware"
zh = "中间件"

# The framework's `Router`, in lower case. The uppercase `ROUTER` is a ZeroMQ socket type and
# is not a word of any language, so the match is deliberately case-sensitive: a page about
# DEALER/ROUTER must not be asked to render the socket name as the framework's router.
[[term]]
en = "router"
en_match = "(?-i:routers?)"
ru = "роутер"
ru_match = "роутер"
zh = "路由器"

[[term]]
en = "codec"
en_match = "codecs?"
ru = "кодек"
ru_match = "кодек"
zh = "编解码器"

[[term]]
en = "back-pressure"
en_match = "back[- ]?pressure"
ru = "обратное давление"
ru_match = "обратн\\w* давлени"
zh = "背压"

[[term]]
